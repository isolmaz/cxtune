[package]
name = "cxtune-gui"
version = "0.1.0"
edition = "2024"
description = "Window and notification-area icon for cxtune"
license = "MIT"
rust-version = "1.92"
publish = false

[features]
# Development only: `--snapshot <dir>` renders the window to PNG files and exits.
snapshot = ["dep:png"]

[dependencies]
cxtune = { path = ".." }
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
    "raw-window-handle-06",
] }
raw-window-handle = "0.6"
winreg = "0.56"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
png = { version = "0.18", optional = true }

[build-dependencies]
slint-build = "=1.18.1"
embed-resource = "3"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell"] }
