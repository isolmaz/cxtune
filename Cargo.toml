[package]
name = "cxtune"
version = "0.1.0"
edition = "2024"
description = "Hiss fix and mic boost tuner for the HyperX Cloud II USB dongle (CX20773), RAM-only"
license = "MIT"
rust-version = "1.88"
publish = false

[dependencies]
hidapi = "2.6"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Variant"] }
